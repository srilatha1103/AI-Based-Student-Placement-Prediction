{% extends "student/student_base.html" %}

{% block title %}Change Password - Student Portal{% endblock %}
{% block page_title %}Security Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="student-card">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-3 p-3 bg-primary bg-opacity-10 text-primary">
                    <i class="fas fa-shield-alt fa-2x"></i>
                </div>
                <div>
                    <h3 class="font-heading fw-bold fs-5 m-0">Change Password</h3>
                    <p class="text-muted small m-0">Update your account password for enhanced security</p>
                </div>
            </div>

            <form action="{{ url_for('student.change_password') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Current Password *</label>
                    <input type="password" name="current_password" class="form-control form-control-student" required placeholder="Enter current password">
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">New Password *</label>
                    <input type="password" name="new_password" class="form-control form-control-student" minlength="6" required placeholder="Minimum 6 characters">
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small fw-semibold">Confirm New Password *</label>
                    <input type="password" name="confirm_password" class="form-control form-control-student" minlength="6" required placeholder="Re-enter new password">
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow border-0" style="background: var(--student-primary-gradient); border-radius: 10px;">
                    <i class="fas fa-save me-2"></i> Update Password
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
