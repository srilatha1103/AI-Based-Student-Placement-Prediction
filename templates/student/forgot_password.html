<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PlacementIQ</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Student CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/student.css') }}">
</head>
<body class="student-auth-body">

    <div class="student-auth-card">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-4 p-3 mb-2 shadow" style="width: 54px; height: 54px; background: var(--student-primary-gradient) !important;">
                <i class="fas fa-key fa-lg"></i>
            </div>
            <h2 class="fw-bold text-dark font-heading mb-1">Reset Password</h2>
            <p class="text-muted small">Enter your registered email to reset your account password</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} alert-dismissible fade show border-0 small mb-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('student.forgot_password') }}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label text-muted small fw-semibold">Registered Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-envelope"></i></span>
                    <input type="email" class="form-control form-control-student border-start-0" id="email" name="email" placeholder="student@college.edu" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label text-muted small fw-semibold">New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control form-control-student border-start-0" id="new_password" name="new_password" minlength="6" placeholder="Minimum 6 chars" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirm_password" class="form-label text-muted small fw-semibold">Confirm New Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock"></i></span>
                    <input type="password" class="form-control form-control-student border-start-0" id="confirm_password" name="confirm_password" minlength="6" placeholder="Re-enter new password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2.5 fw-semibold shadow border-0" style="background: var(--student-primary-gradient); border-radius: 10px;">
                <i class="fas fa-sync-alt me-2"></i> Reset Password
            </button>
        </form>

        <div class="mt-3 text-center">
            <a href="{{ url_for('student.login') }}" class="text-primary text-decoration-none small fw-bold">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
