{% extends 'base.html' %}

{% block title %}500 Internal Server Error - PlacementIQ AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-2">500</div>
        <h2 class="fw-bold text-dark mb-3">Internal Server Error</h2>
        <p class="text-muted fs-5 max-w-md mx-auto mb-4">
            An unexpected error occurred on our servers. Our technical team and system monitors have been automatically notified.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary rounded-pill px-4 py-2 fw-bold">
                <i class="fas fa-home me-2"></i> Return to Home
            </a>
            <button onclick="location.reload()" class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-bold">
                <i class="fas fa-sync-alt me-2"></i> Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
