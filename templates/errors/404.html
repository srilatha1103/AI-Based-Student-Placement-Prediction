{% extends 'base.html' %}

{% block title %}404 Page Not Found - PlacementIQ AI{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h2 class="fw-bold text-dark mb-3">Page Not Found</h2>
        <p class="text-muted fs-5 max-w-md mx-auto mb-4">
            The page or resource you are looking for might have been moved, deleted, or does not exist.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary rounded-pill px-4 py-2fw-bold">
                <i class="fas fa-home me-2"></i> Return to Home
            </a>
            <a href="/predict" class="btn btn-outline-secondary rounded-pill px-4 py-2fw-bold">
                <i class="fas fa-calculator me-2"></i> Placement Predictor
            </a>
        </div>
    </div>
</div>
{% endblock %}
