<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Company Recruitment Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/company.css') }}">
</head>
<body class="auth-page-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="company-brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.5rem;">
                <i class="fas fa-lock"></i>
            </div>
            <h3>Set New Password</h3>
            <p class="mb-0 text-white-50">Create a secure new password for your company portal</p>
        </div>
        <div class="auth-body">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }} alert-dismissible fade show border-0 shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('company.reset_password') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-envelope me-1 text-primary"></i> Company Email</label>
                    <input type="email" class="form-control" name="email" value="{{ email }}" required readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label"><i class="fas fa-key me-1 text-primary"></i> New Password</label>
                    <input type="password" class="form-control" name="new_password" placeholder="At least 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2.5 fw-bold shadow-sm mb-3">
                    <i class="fas fa-check me-2"></i> Update Password & Login
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('company.login') }}" class="text-secondary text-decoration-none small">
                    <i class="fas fa-arrow-left me-1"></i> Back to Login
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
