{% extends 'email/base_email.html' %}

{% block email_content %}
<h2 style="color: #1e40af; margin-top: 0;">Application Status Update</h2>
<p>Dear <strong>{{ name }}</strong>,</p>

<p>There is a status update regarding your application for <strong>{{ job_title }}</strong> at <strong>{{ company_name }}</strong>.</p>

<div style="text-align: center; margin: 25px 0;">
    <div style="font-size: 14px; color: #64748b;">New Status:</div>
    <div style="font-size: 24px; font-weight: bold; color: #1e40af; margin-top: 5px;">{{ status }}</div>
</div>

<p>{{ message }}</p>

<div style="text-align: center; margin: 25px 0;">
    <a href="http://127.0.0.1:5000/student/my-applications" class="btn-cta">Track Applications in Portal</a>
</div>
{% endblock %}
